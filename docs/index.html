<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suitability Demo</title>
    <!-- PyScript CDN -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.2/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.2/core.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
            color: #24292e;
            line-height: 1.5;
        }

        .card {
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input[type="password"],
        input[type="text"],
        textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        button:hover {
            background-color: #2c974b;
        }

        button:disabled {
            background-color: #94d3a2;
            cursor: not-allowed;
        }

        #status {
            font-size: 0.9em;
            color: #586069;
            margin-bottom: 16px;
        }

        pre {
            background: #f6f8fa;
            border: 1px solid #e1e4e8;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 80px;
        }

        .badge {
            display: inline-block;
            background: #fff8c5;
            color: #735c0f;
            border: 1px solid rgba(27, 31, 35, 0.15);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Suitability Demo</h1>
        <p>An agent that decides if a product fits you — not the other way around.</p>

        <div class="badge">
            🔒 API keys are stored in browser memory and never saved.
        </div>

        <div class="form-group">
            <label for="apiKey">Anthropic API Key:</label>
            <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off">
        </div>

        <div class="form-group">
            <label for="inputData">Product / User Specs:</label>
            <textarea id="inputData" placeholder="Enter specs or criteria to evaluate..."></textarea>
        </div>

        <button id="runBtn">Run Match</button>

        <h3>Output</h3>
        <pre id="output">Result will appear here...</pre>
    </div>

    <!-- Python execution placeholder -->
    <script type="py">
        from pyscript import display

        # TODO: Implement your match.py logic here or import remote dependencies
        display("Placeholder for Suitability Application", target="output")
    </script>
</body>

</html>
